belief_list:
  - >-
    基于行业景气度、公司基本面和估值位置，寻找处于趋势初/中期的优质成长股。
    技术面要求温和放量、靠近20日线回踩企稳，避免只买已经脱离5/10/20日线过多的强弩之末标的。
    适合中长线持有，等待趋势延续与业绩兑现。
  - >-
    基于技术面趋势确认、回踩20日线或关键均线企稳、相对强度温和放大，寻找中长线趋势跟随标的。
    拒绝追高已经爆涨、远超20日线的股票，优先选择趋势刚确认、风险收益比较优的标的。
  - >-
    基于公司基本面（营收、利润、ROE、现金流、估值）和行业景气位置，寻找基本面向上但股价尚未超支的中期机会。
    技术面要求上升趋势仍在，买点尽量靠近支撑/20日线，不追已经过热的强势股。
  - >-
    基于宏观周期、行业景气与政策催化，寻找未来几个季度景气持续向上的方向龙头。
    要求估值合理、趋势积极，耐心等待回踩买点，目标是中长期趋势收益。
