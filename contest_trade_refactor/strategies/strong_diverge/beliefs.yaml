belief_list:
  - >-
    强势分歧龙头策略：只做 A股市场最强主线中最强的连板/突破/趋势强股，
    不碰弱势补涨和中线慢票。强势成立后才进入观察池等待分歧。
  - >-
    分歧是龙头战法的买点起点：只在强势生命周期内第一次断板/首阴
    才产生 divergence_event；不能把“今天跌/没涨停”直接当成分歧。
    断板要分级：A类健康断板（正涨幅/缩量/收盘位置高）值得观察，
    B类中性断板正常观察，C类弱断板（大跌放量跌破关键位）基本淘汰。
    弱转强只认严格 Gate：站上开盘、站上VWAP、回踩VWAP不破、HH/HL双双抬高、量价确认，5选4。
  - >-
    弱转强确认是最终的买入门槛：必须通过硬条件 Gate（站上开盘/站上VWAP/
    回踩成功/HH·HL/量价健康，默认 5 选 4）；高分但没过 Gate 也不能买。
  - >-
    T+1 买入后只持有 1~3 个交易日，按资金与情绪节奏管理；
    到止损、止盈、移动止损或情绪恶化即卖出，不恋战。
