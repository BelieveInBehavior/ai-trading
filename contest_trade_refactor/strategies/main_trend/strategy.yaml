# Main Trend Following Engine 主升浪趋势跟踪系统
# 对齐架构：不是“一个score”，而是一台状态机。
# Layer 0 DataQuality -> Layer 1 MarketRegime -> Layer 2 TrendState
# Layer 3 TrendQuality -> Layer 4 SectorState(Ex-Self) -> Layer 5 CatalystState
# -> T+1 Execution -> Layer 6 RiskBudget -> Layer 7 PositionStateMachine
id: main_trend
name: 主升浪趋势跟踪系统
short_name: 主升浪
description: >-
  Main Trend Following Engine（MTF）主升浪趋势跟踪系统。
  T日做全市场快照与候选资格，T+1做价格/执行确认，持仓期间用状态机管理。
  它不是一个 score，而是一台状态机。
horizon: 中短线 1~10 交易日
style: 主升浪 / 趋势跟踪 / MA20+ATR双轨 / 状态机
risk_note: 单笔风险预算优先；C级市场风险预算减半，D级禁止新仓；LLM不参与决策。
tags: [主升浪, 趋势跟踪, MarketRegime, TrendState, ExSelf, RiskBudget, MA20, ATR]

universe:
  all_a: true
  filter_st: true
  filter_new: true
  min_amount_rank: 0

market:
  enabled: true
  min_score_A: 70
  min_score_B: 55
  min_score_C: 40
  c_risk_multiplier: 0.5
  d_forbid_new: true

trend:
  min_s1_breakout_volume: 1.1
  min_s2_rs: 58
  min_s2_volume: 0.9
  allow_high_atr_new_high: true
  min_trading_days: 120
  require_close_gt_ma20: true
  require_ma20_gt_ma60: true
  require_ma60_slope_gt_0: true
  liquidity_percentile: 0.2

quality:
  min_A: 65
  min_B: 45
  multiplier_A: 1.0
  multiplier_B: 0.75
  multiplier_C: 0.5

sector:
  min_sector_score: 45
  switch_sector_data_missing: true
  require_ex_self: true

catalyst:
  enabled: true
  min_freshness: 0.0
  require_company_specific: false
  require_positive_reaction: false

execution:
  min_confirm_score: 60
  allow_gap_strong_trend: true
  require_vwap_hold: true
  require_order_flow: true

risk:
  risk_budget_pct: 1.0
  stop_atr_mult: 2.5
  max_position_pct: 50.0

holding:
  horizon_days: 10
  stop_loss_pct: -6.0
  atr_trailing_mult: 3.0
  reduce_decay_threshold: 45
  severe_decay_threshold: 70
  add_only_profit: true
  use_ma20_exit: true
  use_atr_trail_exit: true

backtest:
  mode: replay
  default_start: "2026-06-01"
  default_end: "2026-08-18"
  symbols_limit: 0
  concurrency: 4
  horizons: [1, 3, 5]
  rule_pipeline: true
