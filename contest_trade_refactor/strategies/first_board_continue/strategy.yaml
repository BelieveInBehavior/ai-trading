# First Board Continue 首板延续策略包
# 目标：最大化 P(MFE[T+1,T+3] >= +3%)；不是“找龙头 / 预测涨幅”。
# Gate 化决策：先有“首板延续”候选，再逐 Gate PASS 才 BUY；不依赖 buy_score 单分。
# 流程：全市场 -> 基础过滤 -> 首板识别 -> 首板质量 -> 板块共振 -> 上行空间 -> +3%
#       -> T+1 承接确认 -> 买点/风险 Gate -> BUY -> T+1~T+3 管理
id: first_board_continue
name: 首板延续 +3%
short_name: 首板延续
description: >-
  主策略 = First Board Continuation。目标是 T+1~T+3 内最大可实现收益（MFE）>= +3% 的概率最大化。
  首板本身是信息事件，不要求二板/三板，不预测龙头；T+1 只需正常承接（不是必须弱转强）。
horizon: T+1 ~ T+3
style: 首板延续 / 正常承接 / 高胜率短周期 / Gate化
risk_note: 高波动、高频率；通过 7 大 Gate 控制，只有全部合格才买入。
tags: [首板, T+1延续, P3, Gate, +3%, MFE, 短线]

# 强势发现：沿用 strong_diverge 的强股池即可；如无概念/板块共振字段时降权。
discovery:
  universe: all_a
  filter_st: true
  min_amount_rank: 0
  top_k: 300

first_board:
  require_prev_day_not_board: true
  min_first_board_quality_score: 60
  quality_weights:
    seal: 20
    sector: 20
    volume: 15
    position: 10
    momentum: 10
    fund: 10
    sector_role: 10
    market: 5

  # 目标系统新增核心 Gate
  min_upside_room_pct: 3.0          # 距离上方最近压力位不足 +3% 直接淘汰
  min_upside_room_score: 50
  min_sector_breadth_score: 50

# T+1 继续性确认：正常承接，不要求 weak_to_strong
confirmation:
  min_continuation_score: 60
  min_entry_quality_score: 70
  continuation_gates_required: 3
  required_gates:
    - first_board_quality
    - sector_breadth
    - upside_room
    - market_regime
    - continuation
    - entry_quality
    - risk
  continuation_gates:
    - 未快速跌破关键位
    - 未异常放量砸盘
    - 收盘不深跌
    - VWAP/MA5承接优先
    - 板块/入口评分合格
  continuation_min_change_pct: -3.0
  continuation_max_volume_ratio: 4.0
  continuation_key_level_pct: -6.0

# 市场环境 Gate：缺时默认放行，避免回测误杀；有涨停池数据则按情绪硬闸。
market:
  enabled: true
  min_limit_up_count: 30
  min_market_score: 50

# T+1~T+3 管理
holding:
  horizon_days: 3
  stop_loss_pct: -6.0
  take_profit_pct: 5.0
  trailing_trigger_pct: 4.0
  trailing_distance_pct: 5.0
  fast_exit_after: 3
  min_risk_score: 50
  max_volume_ratio: 6.0

# 回测参数
backtest:
  mode: replay
  default_start: "2026-06-01"
  default_end: "2026-08-18"
  symbols_limit: 0
  concurrency: 4
  horizons: [1, 3, 5]
  target_pct: 3.0
  labels:
    - MFE_T1
    - MFE_T2
    - MFE_T3
    - MAE_T1
    - MAE_T2
    - MAE_T3
    - CloseReturn_T1
    - CloseReturn_T2
    - CloseReturn_T3
    - Target_3
  rule_pipeline: true
