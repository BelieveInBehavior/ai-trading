# First Board Continue 首板后延续策略包
# 独立于 strong_diverge 的 C 类机会策略：不要求弱转强，只交易“首板后 → T+1正常延续”的高胜率短机会。
# 流程：A股全市场 -> 基础过滤 -> 首板严格识别 -> 首板质量评分 -> T+1继续性确认 -> continuation_score -> Entry Quality -> BUY -> T+1~T+3
id: first_board_continue
name: 首板后延续
short_name: 首板延续
description: >-
  独立策略包：只在“首板发生后选高质量首板，并在 T+1 出现正常延续（不是弱转强）时买入，
  目标 T+1~T+3 正收益概率；不预测龙头，不要求二板/涨停/大涨，允许 +1%~+5% 级收益。
horizon: 短线 1~3 交易日
style: 首板后延续 / 正常承接 / 高胜率短周期
risk_note: 高波动、高频率；必须通过首板质量 + T+1延续确认 + 入场质量三重门槛
tags: [首板, T+1延续, 高胜率, 短线, 首板后]

# 强势发现：沿用 strong_diverge 的强股池即可；如无概念/板块共振字段时降权。
discovery:
  universe: all_a
  filter_st: true
  min_amount_rank: 0
  top_k: 300

# 首板严格识别与质量
first_board:
  # 哪个代码库仍在用全部 A 股，质量数据可能由 strong_diverge 的 technical_factor 提供。
  require_prev_day_not_board: true      # 前一交易日未涨停 + 今日涨停
  min_first_board_quality_score: 60
  quality_weights:
    seal: 20
    sector: 20
    volume: 15
    position: 10
    momentum: 10
    fund: 10
    sector_role: 10
    market: 5

# T+1 继续性确认（不要求 weak_to_strong）
confirmation:
  min_continuation_score: 60
  min_entry_quality_score: 70
  continuation_gates_required: 2
  continuation_gates:
    - 未快速跌破关键位
    - 未异常放量砸盘
    - 收盘不深跌
    - VWAP/MA5承接优先
    - 板块/入口评分合格
  continuation_min_change_pct: -3.0
  continuation_max_volume_ratio: 4.0
  continuation_key_level_pct: -6.0

# T+1~T+3 管理
holding:
  horizon_days: 3
  stop_loss_pct: -6.0
  take_profit_pct: 5.0
  trailing_trigger_pct: 4.0
  trailing_distance_pct: 5.0
  fast_exit_after: 3

# 回测参数
backtest:
  mode: replay
  default_start: "2026-06-01"
  default_end: "2026-08-18"
  symbols_limit: 0
  concurrency: 4
  horizons: [1, 3, 5]
  rule_pipeline: true
