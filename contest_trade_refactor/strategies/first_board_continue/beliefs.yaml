belief_list:
  - >-
    主目标 = P(MFE[T+1,T+3] >= +3%)，不是预测涨停、不是找龙头。首板本身是信息事件，从首板后的短期重新定价中赚 +3%。
  - >-
    首板必须是严格事件：前一交易日未涨停 + 今日涨停。孤立首板（无板块共振）续概率低。
  - >-
    七大因子组：首板质量、板块共振、成交换手、首板前结构、+3%上行空间、T+1承接、市场环境。
    其中上行空间和板块是核心，部分作为 Gate 而不是加分项；上方压力不足 +3% 的候选直接淘汰。
  - >-
    T+1 只要求正常承接：不快速跌破关键位、不异常放量砸盘、收盘不深跌、VWAP/MA5承接优先。
    未通过硬 Gate 不能买入，分数高也没用。
  - >-
    不要再用一个 buy_score 决定买不买。候选 = FIRST_BOARD_CONTINUATION，Gate 全过才 BUY；
    失败时要明确记录 first_failed_gate，方便后续做 factor 归因。
