belief_list:
  - >-
    关注资金共识最强、量比(今日量/前5日均量)和额比(今日额/前5日均额)明确、催化剂明确的短线主线；
    主线本身由量化池给出，不在研究阶段预设AI/半导体等具体题材。买强势、买放量、买强主线龙头；
    短线1-3日节奏为主，准备严格止损。
  - >-
    偏好高动量、今日量较前5日均量放大(量比>=1.2)、今日成交额较前5日均额放大(额比>=1.2)、
    资金净流入靠前、处于板块主升阶段的标的。接受相对高位，寻找更强加速；一旦动能衰退就快速离场。
  - >-
    喜欢事件催化、涨价、订单、超预期公告带来的短线博弈机会；优先资金合力和龙虎榜关注标的。
  - >-
    主线板块中的弹性标的，敢于在资金共识最强时交易，但严格止损，不恋战。
