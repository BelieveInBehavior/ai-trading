researcher_contest_config:
  contest_mode: False
  judger_config: llm
  num_judgers: 3
  window_m: 3
  window_n: 3

# 信号筛选：严格门控不变，研究阶段重复运行直到满足最少买入数
signal_selection_config:
  require_min_buys: 1          # 至少 N 只通过门控的买入才停止；0 = 只跑一轮（旧行为）
  max_research_rounds: 10      # 上限轮次，防止无限重试
  reject_future_evidence: true  # 拒绝分析时点之后的证据，避免回测/选股偷看未来
  risk_veto_enabled: true      # 开启不可交易、硬风险和数据质量 veto
  consensus_enabled: true      # 启用多研究 Agent 的确定性共识
  consensus_method: weighted_majority
  consensus_require_majority: true
  multi_timeframe_enabled: true       # 周线定方向 + 相对强度选股 + 日线找买点
  relative_strength_benchmark: sh000300 # 个股相对沪深300的超额收益基准
  min_weekly_trend_score: 55           # 周线趋势最低分
  min_relative_strength_score: 50      # 相对强度最低分
  min_relative_strength_20d_pct: 0     # 20日跑赢基准至少 0 个百分点
  min_daily_entry_score: 50            # 日线入场触发最低分
  quantitative_screen_enabled: true    # 先从全市场股票池做量化预筛选
  quantitative_screen_fail_open: false # 量化预筛失败时不允许研究 Agent 绕过筛选
  quantitative_screen_max_symbols: 0   # 0 = 扫描全部股票
  quantitative_screen_top_k: 80        # 交给 Research Agent 的候选上限
  quantitative_screen_concurrency: 8   # 历史行情并发请求数
  quantitative_screen_history_days: 260
  quantitative_screen_min_amount: 0    # 0 = 不按成交额预先截断
  require_data_quality: true           # OHLCV、日期和未来数据校验必须通过
  require_weinstein_stage2: true      # 只把温斯坦第二阶段候选交给研究 Agent
