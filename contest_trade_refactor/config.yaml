  - agent_name: "individual_fund_flow_agent"
    data_source_list:
      - "data_source.individual_fund_flow_akshare.IndividualFundFlowAkshare"
  - agent_name: "margin_trading_agent"
    data_source_list:
      - "data_source.margin_trading_akshare.MarginTradingAkshare"
    passthrough_summary: true
  - agent_name: "block_trade_agent"
    data_source_list:
      - "data_source.block_trade_akshare.BlockTradeAkshare"
  - agent_name: "sector_fund_flow_trend_agent"
    data_source_list:
      - "data_source.sector_fund_flow_trend_akshare.SectorFundFlowTrendAkshare"
